# vim:fdm=marker
#
# Cheatsheet: `C-b C-h`, or tmux/cheatsheet.md

# Settings                                                                  {{{1
# ==============================================================================

set-option -s escape-time 0
set-option -g mouse on
set-window-option -g mode-keys emacs
set-option -g detach-on-destroy off
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-features ",xterm-256color:RGB"
set-option -g default-shell "/bin/zsh"
set-option -g history-limit 50000
set-option -g allow-rename off

# Added keys                                                                {{{1
# ==============================================================================

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

bind-key r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

bind-key C-x set-window-option synchronize-panes \; \
    display-message "synchronize-panes #{?pane_synchronized,on,off}"

bind-key C-h display-popup -E -w 78 -h 90% \
    'conf=$(readlink "$HOME/.tmux.conf" || echo "$HOME/.tmux.conf"); less -R "$(dirname "$conf")/cheatsheet.md"'

bind-key P run-shell 'mkdir -p ~/.tmux-logs' \; \
    pipe-pane -o 'cat >> ~/.tmux-logs/#{session_name}-#{window_name}-#{pane_index}.log' \; \
    display-message "logging #{?pane_pipe,to ~/.tmux-logs/,off}"

# Status line                                                               {{{1
# ==============================================================================

set-option -g status-interval 5
set-option -g status-justify left
set-option -g status-style "bg=#262626,fg=#9e9e9e"

set-option -g status-left-length 30
set-option -g status-left " #[fg=#5f8787,bold]#S#[default] "

set-option -g status-right-length 40
set-option -g status-right " #[fg=#5f8787]%a %d %b #[bold]%H:%M "

set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format " #I:#W "
set-window-option -g window-status-current-style "bg=#5f8787,fg=#262626,bold"
set-window-option -g window-status-activity-style "fg=#d7875f"

set-option -g pane-border-style "fg=#444444"
set-option -g pane-active-border-style "fg=#5f8787"

set-option -g message-style "bg=#5f8787,fg=#262626"
